
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <header class="heading-card">
        <h1>SpendWise</h1>
        <p>Manage your money wisely, one expense at a time.</p>
    </header>

    <main>
        <section class="form-card">
            <h2>Add Expense</h2>

            <form id="expense-form">
                <label for="expense-name">Expense Name</label>
                <input type="text" id="expense-name" placeholder="e.g. Transport" required>

                <label for="expense-amount">Amount (KSh)</label>
                <input type="number" id="expense-amount" placeholder="Enter amount" min="1" required>

                <label for="expense-category">Category</label>
                <select id="expense-category" required>
                    <option value="">Select category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Education">Education</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section class="table-card">
            <h2>Expense Table</h2>

            <table>
                <thead>
                    <tr>
                        <th>Expense Name</th>
                        <th>Amount (KSh)</th>
                        <th>Category</th>
                    </tr>
                </thead>
                <tbody id="expense-list">
                    <tr>
                        <td>Food</td>
                        <td>500</td>
                        <td>Food</td>
                    </tr>
                    <tr>
                        <td>Transport</td>
                        <td>200</td>
                        <td>Transport</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

<script src="script.js"></script>

</body>
</html>
